<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1E2428" />
  <title>Kennari</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .screen { display: flex; flex-direction: column; flex: 1; }

    .form-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 28px calc(48px + env(safe-area-inset-bottom, 0px));
    }

    .form-heading {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      color: var(--cream);
      letter-spacing: 0.02em;
      line-height: 1;
      margin-bottom: 36px;
    }

    .form-fields { display: flex; flex-direction: column; gap: 16px; }
    .field-group { display: flex; flex-direction: column; gap: 8px; }
    .form-cta    { margin-top: 32px; }

    .auth-error {
      display: none;
      margin-top: 12px;
      font-size: var(--text-sm);
      color: var(--accent);
      text-align: center;
      line-height: 1.4;
    }
    .auth-error.visible { display: block; }

    .notice {
      font-size: var(--text-base);
      color: var(--text-muted);
      line-height: 1.65;
    }

    .btn-primary .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(242, 232, 217, 0.35);
      border-top-color: var(--cream);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-primary.loading .btn-label { display: none; }
    .btn-primary.loading .spinner   { display: block; }
    .btn-primary:disabled           { opacity: 0.7; cursor: not-allowed; transform: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <div class="screen">
      <div class="form-content">
        <h2 class="form-heading">NEW PASSWORD</h2>

        <!-- Shown while the recovery link is being verified -->
        <p id="reset-wait" class="notice">Checking your reset link…</p>

        <!-- Shown if the link is missing, expired or already used -->
        <div id="reset-invalid" style="display:none">
          <p class="notice">This reset link is invalid or has expired.</p>
          <div class="form-cta">
            <a href="index.html" class="btn-primary" style="text-decoration:none">
              <span class="btn-label">BACK TO LOG IN</span>
            </a>
          </div>
        </div>

        <div id="reset-form" style="display:none">
          <div class="form-fields">
            <div class="field-group">
              <label class="label-caps" for="new-password">New Password</label>
              <input
                id="new-password"
                type="password"
                class="input-field"
                placeholder="Min. 6 characters"
                autocomplete="new-password"
              />
            </div>
          </div>
          <div class="form-cta">
            <button id="btn-reset" class="btn-primary" type="button">
              <span class="btn-label">SAVE PASSWORD</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
            <p id="reset-error" class="auth-error" role="alert"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, updatePassword } from './supabase.js';

    const waitEl    = document.getElementById('reset-wait');
    const invalidEl = document.getElementById('reset-invalid');
    const formEl    = document.getElementById('reset-form');
    const pwEl      = document.getElementById('new-password');
    const btn       = document.getElementById('btn-reset');
    const errEl     = document.getElementById('reset-error');

    function showForm() {
      waitEl.style.display    = 'none';
      invalidEl.style.display = 'none';
      formEl.style.display    = 'block';
    }

    function showInvalid() {
      waitEl.style.display    = 'none';
      formEl.style.display    = 'none';
      invalidEl.style.display = 'block';
    }

    // The recovery link signs the user in with a temporary session and
    // fires PASSWORD_RECOVERY once the URL token has been exchanged.
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') showForm();
    });

    // Link carries an error (expired / already used) or no token at all.
    const hasError = /error/.test(window.location.hash + window.location.search);
    if (hasError) {
      showInvalid();
    } else {
      setTimeout(async () => {
        if (formEl.style.display === 'block') return;
        const { data: { session } } = await supabase.auth.getSession();
        session ? showForm() : showInvalid();
      }, 3000);
    }

    async function handleReset() {
      errEl.textContent = '';
      errEl.classList.remove('visible');

      const password = pwEl.value;
      if (password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.classList.add('visible');
        return;
      }

      btn.disabled = true;
      btn.classList.add('loading');
      const { error } = await updatePassword(password);
      btn.disabled = false;
      btn.classList.remove('loading');

      if (error) {
        errEl.textContent = error.message || 'Something went wrong. Please try again.';
        errEl.classList.add('visible');
        return;
      }

      window.location.replace('home.html');
    }

    btn.addEventListener('click', handleReset);
    pwEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleReset(); });
  </script>
</body>
</html>
